services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DOTNET_SDK_IMAGE: ${DOTNET_SDK_IMAGE}
        DOTNET_ASPNET_IMAGE: ${DOTNET_ASPNET_IMAGE}
        BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      Authentication__JwtSecret: ${JWT_SECRET:?JWT_SECRET is required}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${BACKEND_CONTAINER_PORT}${BACKEND_HEALTH_PATH}"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${BACKEND_HEALTH_START_PERIOD}
    restart: ${RESTART_POLICY}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT}
    environment:
      VITE_HOST: ${VITE_HOST}
      FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      API_PROXY_TARGET: ${API_PROXY_TARGET}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${FRONTEND_CONTAINER_PORT}${FRONTEND_HEALTH_PATH}"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${FRONTEND_HEALTH_START_PERIOD}
    restart: ${RESTART_POLICY}

networks:
  default:
    name: ${DOCKER_NETWORK_NAME}
    driver: ${DOCKER_NETWORK_DRIVER}
